name: Fork validation

on:
  pull_request:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: ${{ matrix.edition }} build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [Lite, Full]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          submodules: ${{ matrix.edition == 'Full' && 'recursive' || 'false' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Test update automation and fork invariants
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          python3 .github/scripts/check-fork-invariants.py
      - name: Verify upstream dictionary distribution and release tools
        run: |
          python3 tools/classified-dictionaries/prepare.py --check
          python3 -m unittest discover -s tools/release -v
      - name: Build ${{ matrix.edition }} Debug
        id: build
        run: ./gradlew :app:assemble${{ matrix.edition }}StandardDebug --stacktrace --no-daemon --max-workers=2
      - name: Run app unit tests
        run: ./gradlew :app:test${{ matrix.edition }}StandardDebugUnitTest --stacktrace --no-daemon --max-workers=2
      - name: Run Android Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew :app:lint${{ matrix.edition }}StandardDebug --stacktrace --no-daemon --max-workers=2
      - name: Build optimized ${{ matrix.edition }} Release without signing
        run: ./gradlew :app:assemble${{ matrix.edition }}StandardReleaseUnsigned --stacktrace --no-daemon --max-workers=1
      - name: Build optimized F-Droid Release without signing
        if: matrix.edition == 'Lite'
        run: ./gradlew :app:assembleLiteFdroidReleaseUnsigned --stacktrace --no-daemon --max-workers=1
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-validation-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ref || github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
