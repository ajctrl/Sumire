name: Fork validation

on:
  pull_request:
    branches: [dev]
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  android:
    name: Lite build, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Test update automation and fork invariants
        run: |
          python3 -m unittest discover -s .github/scripts/tests -v
          python3 .github/scripts/check-fork-invariants.py
      - name: Build Lite Debug
        id: build
        run: ./gradlew :app:assembleLiteStandardDebug --stacktrace --no-daemon --max-workers=2
      - name: Run app unit tests
        run: ./gradlew :app:testLiteStandardDebugUnitTest --stacktrace --no-daemon --max-workers=2
      - name: Run Android Lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./gradlew :app:lintLiteStandardDebug --stacktrace --no-daemon --max-workers=2
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.ref || github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
