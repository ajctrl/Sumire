name: Sync upstream release

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ajctrl/Sumire' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      head: ${{ steps.sync.outputs.head }}
      base: ${{ steps.sync.outputs.base }}
      pr: ${{ steps.sync.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: API budget day (UTC)
        id: budget
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore API budget reservations
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sumire-openai-budget.json
          key: sumire-openai-budget-v1-${{ steps.budget.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sumire-openai-budget-v1-${{ steps.budget.outputs.day }}-
      - name: Prepare update PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
          OPENAI_DAILY_TOKEN_BUDGET: ${{ vars.OPENAI_DAILY_TOKEN_BUDGET || '200000' }}
          OPENAI_BUDGET_FILE: ${{ runner.temp }}/sumire-openai-budget.json
          OPENAI_BUDGET_DAY: ${{ steps.budget.outputs.day }}
        run: python3 .github/scripts/sync-upstream.py
      - name: Save API budget reservations, including failed requests
        if: ${{ always() && steps.budget.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sumire-openai-budget.json
          key: sumire-openai-budget-v1-${{ steps.budget.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fork-validation.yml
    with:
      ref: ${{ needs.prepare.outputs.head }}

  merge:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # No checkout or execution of code from the update branch with this token.
      - name: Merge the validated revision
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
          TESTED_HEAD: ${{ needs.prepare.outputs.head }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          current_base=$(gh api "repos/$REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          test "$current_base" = "$TESTED_BASE" || {
            echo 'dev changed during validation; rerun the sync workflow.' >&2
            exit 1
          }
          gh api "repos/$REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/upstream-pr.json"
          jq -e --arg head "$TESTED_HEAD" --arg repo "$REPOSITORY" \
            '.state == "open" and .draft == false and .base.ref == "dev" and
             .head.repo.full_name == $repo and .head.sha == $head' \
            "$RUNNER_TEMP/upstream-pr.json"
          gh api --method PUT "repos/$REPOSITORY/pulls/$PR/merge" \
            -f sha="$TESTED_HEAD" -f merge_method=merge \
            --jq 'if .merged then "sha=" + .sha else error(.message) end' >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare, merge]
    # Also retry an unpublished release when upstream has no newer version.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.prepare.outputs.changed == 'false' || needs.merge.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.merge.outputs.sha || needs.prepare.outputs.base }}
      upstream_only: true
    secrets: inherit
