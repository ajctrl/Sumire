name: Validate and publish upstream update

on:
  workflow_run:
    workflows: [Sync upstream release]
    types: [completed]
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: sync-upstream-completion
  cancel-in-progress: false

jobs:
  prepare:
    # Only the dedicated trusted producer can supply plans or repair checkpoints.
    if: >-
      github.repository == 'ajctrl/Sumire' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/prepare-upstream-sync.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'dev' &&
      contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      paused: ${{ steps.plan.outputs.paused }}
      head: ${{ steps.plan.outputs.head }}
      base: ${{ steps.plan.outputs.base }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sumire-sync-plan-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/sync-plan
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Read prepared update
        id: plan
        env:
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 .github/scripts/sync-plan.py read "$RUNNER_TEMP/sync-plan/sync-plan.json"

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fork-validation.yml
    with:
      ref: ${{ needs.prepare.outputs.head }}

  merge:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # No checkout or execution of code from the update branch with this token.
      - name: Merge the validated revision
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ needs.prepare.outputs.pr }}
          TESTED_HEAD: ${{ needs.prepare.outputs.head }}
          TESTED_BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          current_base=$(gh api "repos/$REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          test "$current_base" = "$TESTED_BASE" || {
            echo 'dev changed during validation; rerun the sync workflow.' >&2
            exit 1
          }
          gh api "repos/$REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/upstream-pr.json"
          jq -e --arg head "$TESTED_HEAD" --arg repo "$REPOSITORY" \
            '.state == "open" and .draft == false and .base.ref == "dev" and
             .head.repo.full_name == $repo and .head.sha == $head' \
            "$RUNNER_TEMP/upstream-pr.json"
          gh api --method PUT "repos/$REPOSITORY/pulls/$PR/merge" \
            -f sha="$TESTED_HEAD" -f merge_method=merge \
            --jq 'if .merged then "sha=" + .sha else error(.message) end' >> "$GITHUB_OUTPUT"

  release:
    needs: [prepare, merge]
    # Also retry an unpublished release when upstream has no newer version.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.prepare.outputs.paused != 'true' &&
          (needs.prepare.outputs.changed == 'false' || needs.merge.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.merge.outputs.sha || needs.prepare.outputs.base }}
      upstream_only: true
    secrets: inherit
